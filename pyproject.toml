[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-cnp"
version = "0.1.0"
description = "A small, movement-agnostic Conditional Neural Process implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
app = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
